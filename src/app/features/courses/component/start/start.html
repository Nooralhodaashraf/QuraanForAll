  class="py-10 sm:py-16 lg:py-20 text-center justify-center items-center px-4 sm:px-6 lg:px-10 flex flex-col mx-auto w-full"
>
  <div class="justify-center flex flex-col items-center w-full max-w-sm sm:max-w-xl lg:max-w-none lg:w-[1276px] mx-auto">
    <!-- Title -->
    <div
      class="text-center flex flex-col justify-center items-center px-4 w-full lg:w-[1189px] mx-auto mb-8 lg:mb-16"
    >
      <h2 class="text-xl sm:text-2xl lg:text-[36px] font-semibold text-black">Not Sure Where to Start?</h2>

          />

      </div>
    </div>

    <!-- Mobile Swiper Cards -->
    <div class="w-full max-w-[320px] sm:max-w-md mx-auto lg:hidden">
      <swiper-container
        class="mySwiper w-full"
        slides-per-view="1"
        autoplay="true"
        pagination="true"
      >
        @for (card of courseCategories; track card.title) {
          <swiper-slide class="py-4 px-2">
            <div
              class="p-[1.5px] w-full mx-auto rounded-tl-[50px] rounded-br-[50px] rounded-tr-xl rounded-bl-xl bg-gradient-to-b from-yellow-600 via-emerald-700 to-emerald-900 shadow-xl"
            >
              <div
                class="bg-white h-full w-full rounded-tl-[48px] rounded-br-[48px] rounded-tr-lg rounded-bl-lg pt-7 pb-6 px-4 text-center flex flex-col items-center justify-between min-h-[300px]"
              >
                <img class="h-14 w-auto object-contain" [src]="card.logo" [alt]="card.title" />
                <!-- Title & Description -->
                <div class="pt-4 px-2">
                  <h3 class="font-semibold text-lg text-black mb-2">
                    {{ card.title }}
                  </h3>
                  <p class="text-sm text-gray-700 leading-relaxed">
                    {{ card.description }}
                  </p>
                </div>
                <button
                  (click)="scrollTo(card.target)"
                  class="flex items-center py-2.5 px-4 mt-4 justify-center gap-2 border-0 text-marks text-sm font-semibold text-nowrap cursor-pointer hover:opacity-80 transition"
                >
                  <span>View Courses</span>
                  <svg
                    width="9"
                    height="12"
                    viewBox="0 0 9 12"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path d="M9 6L0 0L0 12L9 6Z" fill="#AF8E45" />
                    <path d="M9 6L0 0L0 12L9 6Z" fill="black" fill-opacity="0.2" />
                  </svg>
                </button>
              </div>
            </div>
          </swiper-slide>
        }
      </swiper-container>
    </div>

    <!-- Desktop Cards -->
    <div class="w-full flex justify-center items-center mx-auto">
      <div
        class="w-full mx-auto overflow-visible px-4 lg:px-7 hidden lg:grid lg:grid-cols-4 justify-center lg:gap-[19px]"
      >
        @for (card of courseCategories; track card.title) {
          <div
            class="py-1.25 w-[279.25px] px-px col-span-1 rounded-tl-[50px] rounded-br-[50px] rounded-tr-xl rounded-bl-xl bg-linear-to-b from-yellow-600 via-emerald-700 to-emerald-900 hover:scale-105 transition duration-300"
          >
            <div
              class="h-full bg-white w-full rounded-tl-[48px] justify-center rounded-br-[48px] rounded-tr-lg rounded-bl-lg p-4 text-center flex flex-col items-center"
            >
              <img class="py-5" [src]="card.logo" [alt]="card.title" />
              <!-- Title -->
              <div class="px-2">
                <h3 class="font-medium text-xl text-black mb-4 leading-7.5">
                  {{ card.title }}
                </h3>

                <!-- Description -->
                <p class="text-[14px] text-black leading-7.5">
                  {{ card.description }}
                </p>

                <button
                  (click)="scrollTo(card.target)"
                  class="flex items-center py-3 px-5 w-full justify-center gap-2 border-0 text-marks text-[14px] font-semibold text-nowrap cursor-pointer hover:opacity-80 transition"
                >
                  <span>View Courses</span>

                  <svg
                    width="9"
                    height="12"
                    viewBox="0 0 9 12"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path d="M9 6L0 0L0 12L9 6Z" fill="#AF8E45" />
                    <path d="M9 6L0 0L0 12L9 6Z" fill="black" fill-opacity="0.2" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</section>
