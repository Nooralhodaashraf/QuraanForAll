        <p class="text-[9px] font-normal sm:text-[11px] text-white/80">
          Choose the plan that fits your schedule.
        </p>
      </div>

      <!-- ================= Duration Buttons ================= -->
      <div class="flex justify-center items-center gap-1.5 sm:gap-2 mt-5">
        @for (duration of durations; track duration) {
          <button
            type="button"
            (click)="selectedDuration = duration"
            [class.bg-[#43B957]]="selectedDuration === duration"
            [class.text-white]="selectedDuration === duration"
            [class.shadow-md]="selectedDuration === duration"
            [class.bg-white]="selectedDuration !== duration"
            [class.text-[#111]]="selectedDuration !== duration"
            class="rounded-[20px] p-[15px_20px] text-[9px] sm:text-[10px] font-semibold transition-all duration-200"
          >
            {{ duration }}
          </button>
        }
      </div>

      <!-- ================= Pricing Cards ================= -->
      <div
        class="mt-5 sm:mt-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 sm:gap-5 lg:gap-2.5 xl:gap-3 max-w-[1050px] mx-auto items-stretch"
      >
        @for (plan of plans; track plan.days) {
          <div
            class="relative flex flex-col bg-white py-[10%] overflow-visible shadow-[0_5px_12px_rgba(0,0,0,0.18)] h-[406px] rounded-[60px_20px]"
          >
            <!-- Most Popular -->
            @if (plan.popular) {
              <div
                class="absolute -top-[8px] right-[7px] z-10 bg-[#E63946] text-white text-[6px] sm:text-[7px] font-bold px-2 py-1 rounded-[2px]"
              >
                Most popular
              </div>
            }

            <!-- Price -->
            <div class="text-center pt-3.5 sm:pt-4">
              <div class="flex items-baseline text-[43px] font-medium justify-center">
                <span class="text-[#111]"> ${{ plan.price }} </span>

                <span class="text-[18px] font-semibold text-[#111] ml-0.5"> /mo </span>
              </div>

              <!-- Old Price -->
              <div class="text-[24.71px] text-gray-400 line-through mt-0.5">
                ${{ plan.oldPrice }}
              </div>
            </div>

            <!-- Days -->
            <div
              class="mt-2 bg-[#EAF7F4] text-center py-1.5 text-[8px] sm:text-[9px] font-semibold text-[#111]"
            >
              {{ plan.days }} Days / Week
            </div>

            <!-- Description -->
            <div class="flex-1 flex items-center justify-center px-3 py-2">
              <p class="text-[8px] sm:text-[9px] leading-4 text-center text-[#333]">
                {{ plan.description }}
              </p>
            </div>

            <!-- Trial Button -->
            <div class="pb-3 sm:pb-3.5 flex justify-center">
              <button
                type="button"
                class="bg-[#43B957] hover:bg-[#369d49] text-white text-[6px] sm:text-[7px] font-medium rounded-[3px] px-3 py-1.5 transition-colors duration-200"
              >
                Start Free Trial
              </button>
            </div>
          </div>
        }
      </div>
    </div>
  </section>
</section>
